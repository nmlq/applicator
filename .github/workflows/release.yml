name: Build and release shiv package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build shiv executable
        run: |
          python -m pip install --upgrade pip shiv
          mkdir --parents dist
          shiv \
            --compressed \
            --console-script applicator \
            --output-file "dist/applicator-${GITHUB_REF_NAME}" \
            .
          chmod +x "dist/applicator-${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/applicator-${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "Applicator ${GITHUB_REF_NAME}"
